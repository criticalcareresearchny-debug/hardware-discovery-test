name: Public OEM document retrieval test
on:
  push:
    branches:
      - test/public-oem-retrieval-20261124
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-oem-retrieval-test-20261124
  cancel-in-progress: true
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Install bounded PDF text reader
        run: python3 -m pip install --disable-pip-version-check --target /tmp/oem_pdf_reader pypdf==5.9.0
      - name: Bounded Python public document check
        env:
          PYTHONPATH: /tmp/oem_pdf_reader
        run: |
          python3 - <<'PY'
          import hashlib, json, re
          from urllib.request import Request, urlopen
          from urllib.parse import urlsplit
          from urllib.robotparser import RobotFileParser
          from urllib.error import HTTPError
          from io import BytesIO
          from pypdf import PdfReader
          
          sources = [
              ("Mobilint", "https://docs.mobilint.com/manuals/mld-r1-ai-usb/Mobilint_MLD-R1_User_Guide_v2_KR.pdf", [r"MLD-R1",r"REGULUS",r"20\s*TOPS",r"INT4",r"10\s*TOPS",r"INT8",r"3\.5\s*[-~–]\s*4\s*W",r"8\s*GB",r"LPDDR4X",r"90\s*[x×X]\s*40\s*[x×X]\s*16",r"88\s*g",r"IP65",r"USB\s*3\.1"]),
              ("Bertin", "https://www.bertin-technologies.com/wp-content/uploads/2024/12/adaptive-optics-catalog.pdf", [r"eDM\s*57[-–]15",r"eDM\s*69[-–]15",r"eDM\s*97[-–]15",r"13\.5",r"10\.5",r"51\.5",r"55\.9",r"245",r"0\.8",r"2025\s*\.\s*a"]),
              ("F&S", "https://www.fs-net.de/assets/download/docu/M2/FS-M2-AI_Quickfacts.pdf", [r"V1I\s*[:]?\s*8\s*GB",r"V2I\s*[:]?\s*2\s*GB",r"V2I\s*[:]?\s*16\s*GB",r"V3I\s*[:]?\s*16\s*GB",r"March\s+2026",r"September\s+2026",r"6\.5\s*W",r"3\.3\s*V",r"-25\s*°?\s*C",r"-40\s*°?\s*C"])
          ]
          agent = "PublicOEMResearchTest/1.0 (+https://github.com/criticalcareresearchny-debug/hardware-discovery-test)"
          cap = 8*1024*1024
          for name,url,patterns in sources:
              result = {"source":name,"url":url}
              try:
                  parts=urlsplit(url)
                  rp=RobotFileParser()
                  try:
                      with urlopen(Request(parts.scheme+"://"+parts.netloc+"/robots.txt",headers={"User-Agent":agent}),timeout=8) as f:
                          rp.parse(f.read(120000).decode("utf-8","replace").splitlines())
                  except HTTPError as e:
                      if e.code not in (404,410):
                          raise
                      rp.parse([])
                  if not rp.can_fetch(agent,url):
                      result["outcome"]="SKIPPED_ROBOTS"
                  else:
                      with urlopen(Request(url,headers={"User-Agent":agent,"Accept":"application/pdf"}),timeout=12) as f:
                          data=f.read(cap+1)
                          result.update(status=f.status,bytes=len(data),final_url=f.geturl())
                      if len(data)>cap:
                          result["outcome"]="SIZE_LIMIT"
                      elif not data.startswith(b"%PDF"):
                          result["outcome"]="NOT_PDF"
                      else:
                          result.update(outcome="PDF_RETRIEVED",sha256=hashlib.sha256(data).hexdigest())
                          reader=PdfReader(BytesIO(data))
                          texts=[re.sub(r"\s+"," ",p.extract_text() or "") for p in reader.pages]
                          result["pages"]=len(texts)
                          result["spec_pattern_pages"]={p:[i+1 for i,s in enumerate(texts) if re.search(p,s,re.I)] for p in patterns}
                          result["outcome"]="PDF_PARSED"
              except Exception as e:
                  result.update(outcome="CHECK_FAILED",error=type(e).__name__,detail=str(e)[:180])
              print(json.dumps(result,ensure_ascii=False),flush=True)
          PY
