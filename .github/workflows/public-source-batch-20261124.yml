name: Public source batch research
on:
  push:
    branches:
      - test/public-source-batch-20261124
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-source-batch-20261124
  cancel-in-progress: true
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open-access article identity and methods section checks
        run: |
          python3 - <<'PY'
          import hashlib, json, re, time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from xml.etree import ElementTree as ET
          
          # Public article identifiers obtained from public literature databases.
          ids=[
              ("PMC13526877","10.1038/s41467-026-76185-0"),
              ("PMC13385967","10.1038/s41467-026-73624-w"),
              ("PMC13172308","10.1038/s41467-026-70802-8"),
              ("PMC13518895","10.1038/s41467-026-76116-z"),
              ("PMC13726698","10.1002/adma.75027"),
              ("PMC13201615","10.1038/s41467-026-71127-2"),
              ("PMC13351761","10.1002/adma.73595"),
              ("PMC11964925","10.1038/s41586-025-08742-4"),
              ("PMC13577286","10.1080/14686996.2026.2718043"),
              ("PMC12772184",""),
          ]
          agent="PublicDocumentResearchTest/1.0 (+https://github.com/criticalcareresearchny-debug/hardware-discovery-test)"
          cap=8*1024*1024
          patterns={
          "physical_fabrication":r"\bfabricat(?:ed|ion|ing)\b|\bdeposited\b|\bprinted\b",
          "measured_device":r"\bmeasured\b|\bexperiment(?:al|ally)\b",
          "simulation":r"\bsimulat(?:ion|ions|ed)\b|\bSPICE\b",
          "device_stack":r"\bWTe2\b|\bNbO[x2]\b|\bMoS2\b|\bAl2O3\b|\bHfZrO2\b|\bReSe2\b|\bmemristor\b|\bmagnetic tunnel junction\b|\bOECT\b",
          "assembly_boundary":r"\bprinted circuit board\b|\bPCB\b|\bchip carrier\b|\bprobe station\b|\barray\b|\bwire bond",
          "measurement_conditions":r"\b(?:threshold voltage|pulse width|firing time|retention|endurance|conductance|resistance)\b",
          }
          measure=re.compile(r"(?<!\w)[−-]?\d+(?:\.\d+)?\s*(?:nm|µm|μm|mm|µs|μs|ms|ns|µA|μA|mA|mV|V|pJ|nJ|fJ|aJ|pW|nW|mW|kΩ|MΩ|Hz|kHz|MHz|°C)(?!\w)",re.I)
          def norm(e):return " ".join(" ".join(e.itertext()).split()) if e is not None else ""
          def tag(e):return e.tag.split("}")[-1]
          started=time.monotonic()
          summary=[]
          for pmcid,expected in ids:
              url="https://www.ebi.ac.uk/europepmc/webservices/rest/"+pmcid+"/fullTextXML"
              result={"pmcid":pmcid,"expected_doi":expected,"url":url}
              try:
                  with urlopen(Request(url,headers={"User-Agent":agent,"Accept":"application/xml"}),timeout=15) as f:
                      raw=f.read(cap+1)
                  if len(raw)>cap:raise ValueError("size cap reached")
                  root=ET.fromstring(raw)
                  doi=next((norm(e) for e in root.iter() if tag(e)=="article-id" and e.attrib.get("pub-id-type")=="doi"),"")
                  title=next((norm(e) for e in root.iter() if tag(e)=="article-title"),"")
                  if expected and doi.lower()!=expected.lower():raise ValueError("DOI mismatch: "+doi)
                  sections=[]
                  for sec in root.iter():
                      if tag(sec)!="sec":continue
                      heading=next((norm(c) for c in sec if tag(c)=="title"),"")
                      paras=[norm(c) for c in sec if tag(c)=="p"]
                      body=" ".join(paras)
                      if not body:continue
                      matches={k:len(re.findall(v,body,re.I)) for k,v in patterns.items()}
                      if sum(matches.values())==0:continue
                      if not re.search(r"method|fabricat|characteriz|measure|experiment|device|hardware|design|demonstrat|result",heading,re.I) and not re.search(r"fabricat|experimental",body,re.I):continue
                      sections.append({"heading":heading[:130],"hits":matches,"measurement_tokens":list(dict.fromkeys(measure.findall(body)))[:16]})
                  supplements=[e.attrib for e in root.iter() if tag(e) in ("supplementary-material","media")][:10]
                  result.update(status="FULLTEXT_XML_PARSED",doi=doi,title=title[:280],sha256=hashlib.sha256(raw).hexdigest(),bytes=len(raw),sections=sections[:16],supplementary_count=len(supplements))
              except Exception as e:
                  result.update(status="UNAVAILABLE_OR_PARSE_FAILED",error=str(e)[:180])
              summary.append(result["status"])
              print(json.dumps(result,ensure_ascii=False),flush=True)
              # Respect public service load; no retries of 429/403 or unavailable full text.
              time.sleep(1.3)
          print(json.dumps({"summary":{"requested":len(ids),"fulltext_parsed":summary.count("FULLTEXT_XML_PARSED"),"unavailable":summary.count("UNAVAILABLE_OR_PARSE_FAILED"),"elapsed_seconds":round(time.monotonic()-started,2),"tokens_are_not_validated_specifications":True}}))
          PY
