name: Synthetic GitHub–ChatGPT–Python relay test

on:
  push:
    branches:
      - experiment/chatgpt-python-relay-20261117
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  relay-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Evaluate public synthetic relay
        run: python scripts/relay_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-relay-result
          path: experiments/relay-smoke-20261117/result.json
