name: Public instrument documentary verification
on:
  push:
    branches: [supplement/public-instrument-verification-20261127]
    paths:
      - '.github/workflows/public-instrument-document-check.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/public-instrument-document-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Retrieve primary public documents and verify textual anchors
        shell: bash
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import concurrent.futures, datetime, hashlib, json, pathlib, re, subprocess, urllib.request
          from html.parser import HTMLParser
          class TextParser(HTMLParser):
              def __init__(self): super().__init__(); self.parts=[]
              def handle_data(self, data): self.parts.append(data)
          sources=[
              ("kong_author_pdf","https://nanolab.usc.edu/files/2018/03/87444-2duvqsx.pdf",["nanotube"]),
              ("ax5500_photo","https://www.alfaplus.com.tw/uploads/2024/05/1715050580.png",[]),
              ("argus_figure","https://mdpi-res.com/sensors/sensors-26-04941/article_deploy/html/images/sensors-26-04941-g004-550.jpg",[]),
              ("argus_pdf_static","https://mdpi-res.com/sensors/sensors-26-04941/article_deploy/sensors-26-04941.pdf",["ARGUS"]),
              ("genereach_tw","https://www.genereach.com/tw/index.php?action=view&func=product&product_no=12",["R-tube"]),
              ("genereach_published","https://www.genereach.com/data/document%20download/common/Products/Scientific%20Publications/2013_Detection%20of%20Salmonella%20in%20Chicken%20Meat%20by%20Insulated%20Isothermal%20PCR.pdf",["R-tube"]),
              ("probe_catalogue","https://oligos.biosearchtech.com/products/rna-fish/shipready-stellaris-probe-sets",["SMF-2035-1","SMF-2037-1","SMF-2038-1"]),
              ("nzgs2_faq","https://www.nanoz.ai/faq-en.html",["NZGS","TSR"]),
              ("tsr_india","https://www.tsr-india.com/news",["TSR","NANOZ"])
          ]
          def run(item):
              name,url,terms=item
              result={"name":name,"url":url,"checked_utc":datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; public-document-check/1.0)"})
                  with urllib.request.urlopen(request,timeout=35) as resp:
                      raw=resp.read(25000001); result.update(http_status=resp.status,final_url=resp.url,content_type=resp.headers.get("Content-Type",""))
                  if len(raw)>25000000: raise ValueError("document exceeds 25 MB")
                  is_pdf=raw.startswith(b"%PDF-"); is_image=raw.startswith(b"\x89PNG") or raw.startswith(b"\xff\xd8"); p=pathlib.Path("evidence")/(name+(".pdf" if is_pdf else ".png" if raw.startswith(b"\x89PNG") else ".jpg" if is_image else ".html"))
                  p.write_bytes(raw); result.update(bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),raw_file=str(p))
                  if is_image: result["image_status"]="RAW_IMAGE_FOR_LOCAL_REVIEW"; return result
                  if is_pdf:
                      result["pdf_parse_status"]="RAW_PDF_SAVED_FOR_LOCAL_VISUAL_AND_TEXT_REVIEW"; return result
                  else:
                      parser=TextParser();parser.feed(raw.decode("utf-8","replace"));text=" ".join(parser.parts)
                  text_path=pathlib.Path("evidence")/(name+".txt");text_path.write_text(text,encoding="utf-8")
                  normalized=re.sub(r"\\s+"," ",text).casefold()
                  result.update(text_chars=len(text),text_sha256=hashlib.sha256(text.encode()).hexdigest(),anchor_hits={t:t.casefold() in normalized for t in terms},text_file=str(text_path))
              except Exception as ex: result["error"]=str(ex)
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool: results=list(pool.map(run,sources))
          pathlib.Path("evidence/receipt.json").write_text(json.dumps(results,indent=2))
          for r in results: print(json.dumps({k:v for k,v in r.items() if k!="text_file"}))
          print("Retrieval and literal-text anchors only; no scientific identity or eligibility certification.")
          PY
      - name: Upload public evidence receipt
        uses: actions/upload-artifact@v4
        with:
          name: public-instrument-document-check-${{ github.run_id }}
          path: evidence/
          retention-days: 14
